[package]
name = "php-verdict"
version = "5.0.0"
edition = "2021"
description = "Multi-signal PHP malware verdict engine (Rust port of php-verdict.py v4)"

[dependencies]
regex = "1"
rayon = "1"
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
