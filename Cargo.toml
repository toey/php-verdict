[package]
name = "php-verdict"
version = "6.0.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-signal PHP malware verdict engine (signatures, taint, constant folding, polyglot detection, statistics)"

[dependencies]
regex = "1"
rayon = "1"
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
